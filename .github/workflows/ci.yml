name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # test/fixture.test.js drives a real (headless, offline, file://)
      # Chrome instance to exercise selectors against saved HTML fixtures.
      # Without a Chrome binary present, chromePath() throws and every one
      # of those tests calls t.skip -- the run still goes green, it just
      # silently stops proving anything. Installing Chrome here and pointing
      # GPT_IMAGEGEN_CHROME at it is what keeps CI honest: the fixture tests
      # actually execute instead of skipping.
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Test
        env:
          GPT_IMAGEGEN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          # GPT_IMAGEGEN_LIVE is deliberately left UNSET. test/live.test.js
          # already skips itself unless GPT_IMAGEGEN_LIVE=1 (it drives a
          # real, signed-in ChatGPT session and costs a real turn against
          # the user's account), so simply never setting that variable here
          # is enough to keep the live smoke out of CI -- no special
          # exclusion flag needed. The fixture tests in test/fixtures/ are a
          # different thing: those are offline and safe to run in CI, which
          # is why Chrome is installed above.
        run: node --test test/*.test.js

      # Fails if dist/index.cjs (committed to git) is out of date with
      # src/. Without this, the committed bundle can silently drift from
      # the source it's supposed to be built from.
      - name: Verify committed bundle is current
        run: make bundle-check
