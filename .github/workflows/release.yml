name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          name="gpt-imagegen_${{ matrix.goos }}_${{ matrix.goarch }}"
          go build -o "dist/$name" ./cmd/gpt-imagegen
          chmod +x "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpt-imagegen_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/gpt-imagegen_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Flatten artifacts and checksum
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -exec cp -v {} out/ \;
          cd out
          sha256sum * > SHA256SUMS
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*
          fail_on_unmatched_files: true
